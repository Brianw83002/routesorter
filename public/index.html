<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Route sorter</h1>
  <p class="sub">Pick a format, drop the file, remove anyone you don't want, then send.</p>

  <div class="formats" role="group" aria-label="File format">
    <button type="button" class="fmt selected" id="fmt-route" data-format="route">Route sorter</button>
    <button type="button" class="fmt" id="fmt-dcx2" data-format="dcx2">DCX2 format</button>
    <button type="button" class="fmt" id="fmt-hlx1" data-format="hlx1">HLX1 format</button>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    <strong id="drop-title">Drop your CSV or XLSX here</strong>
    <span>or click to choose a file</span>
  </label>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="result" id="result" aria-label="Sorted routes">
    <div id="groups"></div>

    <div class="preview" id="previewBox">
      <div class="preview-head">
        <h2>Text preview</h2>
        <div class="preview-actions">
          <button class="copy" id="copy" type="button" disabled>Copy text</button>
          <button class="copy" id="copyImage" type="button" disabled>Copy as image</button>
        </div>
      </div>
      <pre id="preview"></pre>
    </div>

    <input type="email" id="email" class="email-input" placeholder="Send to email address" required>
    <button class="send" id="send" type="button">Send email</button>
  </section>
</main>

<script>
  const drop = document.getElementById("drop");
  const dropTitle = document.getElementById("drop-title");
  const input = document.getElementById("file");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");
  const sendBtn = document.getElementById("send");
  const emailInput = document.getElementById("email");
  const groupsEl = document.getElementById("groups");
  const previewEl = document.getElementById("preview");
  const copyBtn = document.getElementById("copy");
  const copyImageBtn = document.getElementById("copyImage");
  const fmtButtons = Array.from(document.querySelectorAll(".fmt"));

  const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  let currentFormat = "route";
  let groups = []; // [{ key, label, lines }]

  const FORMAT_LABEL = { route: "CSV or XLSX", dcx2: "DCX2 file", hlx1: "HLX1 file" };

  function selectFormat(btn) {
    fmtButtons.forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    currentFormat = btn.dataset.format;
    dropTitle.textContent = "Drop your " + (FORMAT_LABEL[currentFormat] || "file") + " here";
    result.classList.remove("show");
    statusEl.classList.remove("show");
  }

  fmtButtons.forEach(btn => {
    if (!btn.disabled) btn.addEventListener("click", () => selectFormat(btn));
  });

  function setStatus(kind, text) {
    statusEl.className = "status show " + kind;
    statusEl.textContent = text;
  }

  function buildPreviewText() {
    return groups
      .map(g => [g.label, ...g.lines].join("\n"))
      .join("\n\n");
  }

  function render() {
    groupsEl.replaceChildren();
    groups.forEach((group, gi) => {
      const div = document.createElement("div");
      div.className = "group";
      const h2 = document.createElement("h2");
      h2.textContent = group.label;
      div.appendChild(h2);

      const ul = document.createElement("ul");
      if (group.lines.length === 0) {
        const li = document.createElement("li");
        li.className = "none";
        li.textContent = "No routes";
        ul.appendChild(li);
      } else {
        group.lines.forEach((line, li_i) => {
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.className = "line";
          text.textContent = line;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "remove";
          btn.textContent = "Remove";
          btn.setAttribute("aria-label", "Remove " + line);
          btn.addEventListener("click", () => {
            groups[gi].lines.splice(li_i, 1);
            render();
          });
          li.append(text, btn);
          ul.appendChild(li);
        });
      }
      div.appendChild(ul);
      groupsEl.appendChild(div);
    });

    const total = groups.reduce((sum, g) => sum + g.lines.length, 0);
    sendBtn.disabled = total === 0;
    previewEl.textContent = buildPreviewText();
    copyBtn.disabled = total === 0;
    copyImageBtn.disabled = total === 0;
  }

  async function upload(file) {
    if (!file) return;
    const n = file.name.toLowerCase();
    if (!n.endsWith(".csv") && !n.endsWith(".xlsx")) {
      setStatus("err", "That isn't a .csv or .xlsx file.");
      return;
    }
    result.classList.remove("show");
    setStatus("busy", "Reading " + file.name + "…");

    const data = new FormData();
    data.append("file", file);
    data.append("format", currentFormat);

    try {
      const res = await fetch("/upload", { method: "POST", body: data });
      const json = await res.json();
      if (!res.ok) {
        setStatus("err", json.error || "Something went wrong.");
        return;
      }
      groups = json.groups;
      render();
      result.classList.add("show");
      setStatus("busy", "Loaded " + file.name + ". Remove anyone you don't want, then send.");
    } catch (e) {
      setStatus("err", "Couldn't reach the server. Is Flask running?");
    }
  }

  async function sendEmail() {
    const to = emailInput.value.trim();
    if (!EMAIL_RE.test(to)) {
      setStatus("err", "Enter a valid email address.");
      return;
    }
    sendBtn.disabled = true;
    setStatus("busy", "Sending…");
    try {
      const res = await fetch("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ format: currentFormat, groups, to }),
      });
      const json = await res.json();
      if (!res.ok) {
        setStatus("err", json.error || "Something went wrong.");
      } else {
        setStatus("ok", "Sent to " + json.emailed_to + ".");
      }
    } catch (e) {
      setStatus("err", "Couldn't reach the server. Is Flask running?");
    } finally {
      sendBtn.disabled = groups.reduce((sum, g) => sum + g.lines.length, 0) === 0;
    }
  }

  function previewHtml(text) {
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    return (
      '<pre style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; '
      + 'font-size: 14px; white-space: pre;">' + escaped + "</pre>"
    );
  }

  async function copyPreview() {
    const text = buildPreviewText();

    if (navigator.clipboard && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/plain": new Blob([text], { type: "text/plain" }),
            "text/html": new Blob([previewHtml(text)], { type: "text/html" }),
          }),
        ]);
        setStatus("ok", "Copied to clipboard.");
        return;
      } catch (e) {
        // Some browsers support Clipboard.write() but reject one of the
        // types above -- fall through to the DOM-selection fallback.
      }
    }

    // Fallback: select a hidden monospace block and let execCommand("copy")
    // grab it as rich text, so columns still line up where they land.
    const pre = document.createElement("pre");
    pre.textContent = text;
    pre.style.cssText =
      "position:fixed; top:0; left:0; opacity:0; white-space:pre; " +
      "font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;";
    document.body.appendChild(pre);
    const range = document.createRange();
    range.selectNodeContents(pre);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    try {
      document.execCommand("copy");
      setStatus("ok", "Copied to clipboard.");
    } catch (e2) {
      setStatus("err", "Couldn't copy. Select the text manually.");
    }
    sel.removeAllRanges();
    document.body.removeChild(pre);
  }

  function buildPreviewImage(text, scale = 2) {
    return new Promise((resolve, reject) => {
      const lines = text.split("\n");
      const fontSize = 14;
      const lineHeight = Math.round(fontSize * 1.4);
      const padding = 16;
      const font = fontSize + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

      const measure = document.createElement("canvas").getContext("2d");
      measure.font = font;
      const maxWidth = Math.max(1, ...lines.map(l => measure.measureText(l).width));

      const width = Math.ceil(maxWidth) + padding * 2;
      const height = lines.length * lineHeight + padding * 2;

      const canvas = document.createElement("canvas");
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#1a2430";
      ctx.font = font;
      ctx.textBaseline = "top";
      lines.forEach((line, i) => ctx.fillText(line, padding, padding + i * lineHeight));

      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error("Couldn't render the image."));
      }, "image/png");
    });
  }

  async function copyPreviewImage() {
    let blob;
    try {
      blob = await buildPreviewImage(buildPreviewText());
    } catch (e) {
      setStatus("err", "Couldn't create the image.");
      return;
    }

    if (navigator.clipboard && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        setStatus("ok", "Copied as an image — paste it into iMessage.");
        return;
      } catch (e) {
        // Some browsers support Clipboard.write() but not image types --
        // fall through to opening it in a new tab instead.
      }
    }

    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setStatus("ok", "Opened the image in a new tab — save it, then share from there.");
  }

  copyBtn.addEventListener("click", copyPreview);
  copyImageBtn.addEventListener("click", copyPreviewImage);
  sendBtn.addEventListener("click", sendEmail);

  input.addEventListener("change", () => {
    upload(input.files[0]);
    input.value = "";
  });

  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => upload(e.dataTransfer.files[0]));

  // Stop the browser from opening a file dropped outside the box
  ["dragover", "drop"].forEach(ev =>
    window.addEventListener(ev, e => e.preventDefault()));
</script>
</body>
</html>
