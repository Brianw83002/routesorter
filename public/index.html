<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Route sorter</h1>
  <p class="sub">Drop a route CSV. It's sorted into vans and trucks and emailed to you.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".csv,text/csv">
    <strong>Drop your CSV here</strong>
    <span>or click to choose a file</span>
  </label>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="result" id="result" aria-label="Sorted routes">
    <div class="group"><h2>Vans</h2><ul id="vans"></ul></div>
    <div class="group"><h2>Truck</h2><ul id="trucks"></ul></div>
  </section>
</main>

<script>
  const drop = document.getElementById("drop");
  const input = document.getElementById("file");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");

  function setStatus(kind, text) {
    statusEl.className = "status show " + kind;
    statusEl.textContent = text;
  }

  function fillList(id, lines) {
    const ul = document.getElementById(id);
    ul.replaceChildren();
    if (lines.length === 0) {
      const li = document.createElement("li");
      li.className = "none";
      li.textContent = "No routes";
      ul.appendChild(li);
      return;
    }
    for (const line of lines) {
      const li = document.createElement("li");
      li.textContent = line;
      ul.appendChild(li);
    }
  }

  async function upload(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".csv")) {
      setStatus("err", "That isn't a .csv file.");
      return;
    }
    result.classList.remove("show");
    setStatus("busy", "Sorting and sending " + file.name + "…");

    const data = new FormData();
    data.append("file", file);

    try {
      const res = await fetch("/upload", { method: "POST", body: data });
      const json = await res.json();
      if (!res.ok) {
        setStatus("err", json.error || "Something went wrong.");
        return;
      }
      fillList("vans", json.vans);
      fillList("trucks", json.trucks);
      result.classList.add("show");
      setStatus("ok", "Sent to " + json.emailed_to + ".");
    } catch (e) {
      setStatus("err", "Couldn't reach the server. Is Flask running?");
    }
  }

  input.addEventListener("change", () => {
    upload(input.files[0]);
    input.value = "";
  });

  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => upload(e.dataTransfer.files[0]));

  // Stop the browser from opening a file dropped outside the box
  ["dragover", "drop"].forEach(ev =>
    window.addEventListener(ev, e => e.preventDefault()));
</script>
</body>
</html>
