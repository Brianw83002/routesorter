<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Route sorter</h1>
  <p class="sub">Drop a route CSV. Review the sorted routes, remove anyone you don't want, then send.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".csv,text/csv">
    <strong>Drop your CSV here</strong>
    <span>or click to choose a file</span>
  </label>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="result" id="result" aria-label="Sorted routes">
    <div class="group"><h2>Vans</h2><ul id="vans"></ul></div>
    <div class="group"><h2>Truck</h2><ul id="trucks"></ul></div>
    <button class="send" id="send" type="button">Send email</button>
  </section>
</main>

<script>
  const drop = document.getElementById("drop");
  const input = document.getElementById("file");
  const statusEl = document.getElementById("status");
  const result = document.getElementById("result");
  const sendBtn = document.getElementById("send");

  let vans = [];
  let trucks = [];

  function setStatus(kind, text) {
    statusEl.className = "status show " + kind;
    statusEl.textContent = text;
  }

  function renderList(id, lines) {
    const ul = document.getElementById(id);
    ul.replaceChildren();
    if (lines.length === 0) {
      const li = document.createElement("li");
      li.className = "none";
      li.textContent = "No routes";
      ul.appendChild(li);
      return;
    }
    lines.forEach((line, i) => {
      const li = document.createElement("li");
      const text = document.createElement("span");
      text.textContent = line;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "remove";
      btn.textContent = "Remove";
      btn.setAttribute("aria-label", "Remove " + line);
      btn.addEventListener("click", () => {
        lines.splice(i, 1);
        render();
      });
      li.append(text, btn);
      ul.appendChild(li);
    });
  }

  function render() {
    renderList("vans", vans);
    renderList("trucks", trucks);
    sendBtn.disabled = vans.length + trucks.length === 0;
  }

  async function upload(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".csv")) {
      setStatus("err", "That isn't a .csv file.");
      return;
    }
    result.classList.remove("show");
    setStatus("busy", "Reading " + file.name + "…");

    const data = new FormData();
    data.append("file", file);

    try {
      const res = await fetch("/upload", { method: "POST", body: data });
      const json = await res.json();
      if (!res.ok) {
        setStatus("err", json.error || "Something went wrong.");
        return;
      }
      vans = json.vans;
      trucks = json.trucks;
      render();
      result.classList.add("show");
      setStatus("busy", "Loaded " + file.name + ". Remove anyone you don't want, then send.");
    } catch (e) {
      setStatus("err", "Couldn't reach the server. Is Flask running?");
    }
  }

  async function sendEmail() {
    sendBtn.disabled = true;
    setStatus("busy", "Sending…");
    try {
      const res = await fetch("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vans, trucks }),
      });
      const json = await res.json();
      if (!res.ok) {
        setStatus("err", json.error || "Something went wrong.");
      } else {
        setStatus("ok", "Sent to " + json.emailed_to + ".");
      }
    } catch (e) {
      setStatus("err", "Couldn't reach the server. Is Flask running?");
    } finally {
      sendBtn.disabled = vans.length + trucks.length === 0;
    }
  }

  sendBtn.addEventListener("click", sendEmail);

  input.addEventListener("change", () => {
    upload(input.files[0]);
    input.value = "";
  });

  ["dragenter", "dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => upload(e.dataTransfer.files[0]));

  // Stop the browser from opening a file dropped outside the box
  ["dragover", "drop"].forEach(ev =>
    window.addEventListener(ev, e => e.preventDefault()));
</script>
</body>
</html>
